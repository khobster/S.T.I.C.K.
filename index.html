<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>S.T.I.C.K. — Dugout & Front-Office Scoreboard</title>
<style>
  :root {
    --bg: #0b0e14; --panel: #131824; --line: #232a3a; --ink: #e7ecf5;
    --dim: #8a93a6; --pos: #35c26a; --neg: #e0574a; --chip: #1c2332;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    padding: 28px 20px 18px; text-align: center; border-bottom: 1px solid var(--line);
  }
  h1 {
    margin: 0; font-size: 26px; letter-spacing: 3px; font-weight: 800;
  }
  .sub { color: var(--dim); font-size: 13px; margin-top: 6px; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 18px 14px 60px; }
  .tabs { display: flex; gap: 8px; justify-content: center; margin: 18px 0 6px; }
  .tab {
    background: var(--panel); border: 1px solid var(--line); color: var(--dim);
    padding: 9px 16px; border-radius: 999px; cursor: pointer; font-weight: 700;
    letter-spacing: 1px; font-size: 13px;
  }
  .tab.active { color: var(--ink); border-color: #3a4a6b; background: #182030; }
  .capt { text-align: center; color: var(--dim); font-size: 12.5px; margin: 4px 0 16px; }
  .row {
    display: grid; grid-template-columns: 34px 54px 1fr auto; align-items: center;
    gap: 10px; background: var(--panel); border: 1px solid var(--line);
    border-left: 4px solid var(--accent, #444); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 8px;
  }
  .rank { font-weight: 800; color: var(--dim); text-align: center; font-size: 15px; }
  .team {
    font-weight: 800; letter-spacing: 1px; text-align: center; font-size: 14px;
    padding: 3px 0; border-radius: 6px; background: #0000; color: var(--accent, #ccc);
  }
  .who { min-width: 0; }
  .name { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chips { margin-top: 3px; display: flex; flex-wrap: wrap; gap: 5px; }
  .chip {
    background: var(--chip); border-radius: 5px; padding: 2px 7px; font-size: 11.5px;
    color: var(--dim);
  }
  .chip b { color: var(--ink); font-weight: 700; }
  .score {
    font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums;
    min-width: 68px; text-align: right;
  }
  .pos { color: var(--pos); } .neg { color: var(--neg); }
  footer { text-align: center; color: var(--dim); font-size: 12px; padding: 0 20px 40px; }
  a { color: #6ea8fe; }
  .err { text-align:center; color: var(--neg); padding: 40px; }
</style>
</head>
<body>
<header>
  <h1>S.T.I.C.K.</h1>
  <div class="sub">Manager (W.E.A.V.E.R.) &amp; GM (S.T.I.C.K.) composite scoreboard</div>
</header>

<div class="wrap">
  <div class="tabs">
    <div class="tab active" data-board="weaver">W.E.A.V.E.R. · Managers</div>
    <div class="tab" data-board="stick">S.T.I.C.K. · GMs</div>
  </div>
  <div class="capt" id="capt"></div>
  <div id="board"></div>
</div>

<footer id="foot"></footer>

<script>
const COLORS = {
  ARI:"#A71930",ATL:"#CE1141",BAL:"#DF4601",BOS:"#BD3039",CHC:"#4A90D9",
  CHW:"#C4CED4",CIN:"#C6011F",CLE:"#E31937",COL:"#8B6BB7",DET:"#FA4616",
  HOU:"#EB6E1F",KCR:"#1F6FBF",LAA:"#BA0021",LAD:"#3B8EDE",MIA:"#00A3E0",
  MIL:"#FFC52F",MIN:"#D31145",NYM:"#FF5910",NYY:"#8AA0BF",OAK:"#00A15C",
  PHI:"#E81828",PIT:"#FDB827",SDP:"#FFC425",SEA:"#00B2A9",SFG:"#FD5A1E",
  STL:"#C41E3A",TBR:"#8FBCE6",TEX:"#C0111F",TOR:"#1D77C5",WSN:"#E4002B"
};
const fmt = (v, d=2) => v==null ? "—" : (v>=0?"+":"") + v.toFixed(d);
const money = v => v==null ? "—" : (v>=0?"+$":"-$") + Math.abs(v/1e6).toFixed(0) + "M";
const pct = v => v==null ? "—" : Math.round(v*100) + "%";
const num = (v,d=2) => v==null ? "—" : v.toFixed(d);

function chips(board, r) {
  if (board === "weaver") return [
    ["PV", fmt(r.PV,1)], ["mWPA", fmt(r.mWPA,1)],
    ["LOF", num(r.LOF,3)], ["RSR", pct(r.RSR)]
  ];
  return [
    ["WAR", num(r.roster_war,1)], ["ST", money(r.ST)],
    ["IC", num(r.IC,2)], ["K", fmt(r.K,1)]
  ];
}

function render(board, data) {
  const scoreKey = board === "weaver" ? "WEAVER" : "STICK";
  const nameKey  = board === "weaver" ? "manager" : "gm";
  const el = document.getElementById("board");
  el.innerHTML = data.leaderboard.map((r, i) => {
    const c = COLORS[r.team] || "#888";
    const s = r[scoreKey];
    const cls = s >= 0 ? "pos" : "neg";
    const ch = chips(board, r).map(([k,v]) => `<span class="chip">${k} <b>${v}</b></span>`).join("");
    return `<div class="row" style="--accent:${c}">
      <div class="rank">${i+1}</div>
      <div class="team">${r.team}</div>
      <div class="who">
        <div class="name">${r[nameKey] || "—"}</div>
        <div class="chips">${ch}</div>
      </div>
      <div class="score ${cls}">${fmt(s,2)}</div>
    </div>`;
  }).join("");
  document.getElementById("capt").textContent = board === "weaver"
    ? "Higher = manager squeezing more wins from run differential, bullpen leverage, lineup use & replay."
    : "Higher = GM building more surplus WAR per payroll dollar, keeping the projected roster healthy, with depth.";
}

let cache = {};
async function load(board) {
  if (cache[board]) return render(board, cache[board]);
  const man = await fetch("data/output/manifest.json").then(r=>r.json());
  const data = await fetch("data/output/" + man[board]).then(r=>r.json());
  cache[board] = data;
  render(board, data);
  document.getElementById("foot").innerHTML =
    `Season ${man.season} · updated ${man.generated} · data via MLB StatsAPI + Baseball-Reference.<br>` +
    `mWPA is a Baseball-Reference leverage proxy (WPA/LI is FanGraphs-only). GM names are a static reference. ` +
    `<a href="https://github.com/khobster/S.T.I.C.K.">source</a>`;
}

document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  t.classList.add("active");
  load(t.dataset.board);
}));

load("weaver").catch(e => {
  document.getElementById("board").innerHTML =
    `<div class="err">Couldn't load boards.<br>Run <code>python run.py</code> to generate data/output/*.json.</div>`;
});
</script>
</body>
</html>
